<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 2px;
      }
      /* CSS Animations */
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(1); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .floating-node {
        animation: float 6s ease-in-out infinite;
      }
      .floating-node-delayed {
        animation: float 6s ease-in-out infinite;
        animation-delay: 3s;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-line {
        stroke-dasharray: 12 6;
        animation: drawLine 30s linear infinite;
      }
      .rotating {
        animation: spin 20s linear infinite;
        transform-origin: 950px 200px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.05">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Glowing Elements on Left and Right -->
  <circle cx="100" cy="100" r="150" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1100" cy="300" r="180" fill="#db2777" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Connections in Background -->
  <path d="M -100,200 Q 300,100 600,200 T 1300,200" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="animated-line" opacity="0.3" />
  <path d="M -100,250 Q 400,350 700,220 T 1300,150" fill="none" stroke="url(#secondaryGrad)" stroke-width="1.5" class="animated-line" opacity="0.2" />

  <!-- Left: Content & Text -->
  <g transform="translate(100, 150)">
    <text x="0" y="20" class="title" fill="#ffffff">Awesome Paywall</text>
    <text x="0" y="85" class="title" fill="url(#primaryGrad)" filter="url(#glow)">Management</text>
    <text x="0" y="135" class="subtitle">MONETIZE • GATE • SUBMIT • ENGAGE</text>
  </g>

  <!-- Right: Paywall Representation (Lock & Dashboards) -->
  <g class="floating-node" transform="translate(0, 0)">
    <!-- Shield/Gating Graphic -->
    <path d="M 850,110 L 980,150 L 980,270 L 850,330 L 720,270 L 720,150 Z" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Gated/Unlocked Visual Transition -->
    <circle cx="850" cy="210" r="65" fill="#312e81" stroke="url(#secondaryGrad)" stroke-width="2" />
    
    <!-- Lock Body -->
    <rect x="825" y="195" width="50" height="40" rx="8" fill="url(#secondaryGrad)" />
    <!-- Lock Shackle -->
    <path d="M 835,195 L 835,175 C 835,160 865,160 865,175 L 865,195" fill="none" stroke="url(#secondaryGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Keyhole -->
    <circle cx="850" cy="210" r="5" fill="#1e1b4b" />
    <path d="M 850,210 L 850,223" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Smaller orbiting nodes representing platforms -->
  <circle cx="700" cy="120" r="16" fill="url(#greenGrad)" class="floating-node-delayed" filter="url(#glow)"/>
  <circle cx="1000" cy="140" r="12" fill="url(#primaryGrad)" class="floating-node" />
  <circle cx="680" cy="290" r="10" fill="url(#secondaryGrad)" class="floating-node-delayed" />
  <circle cx="1020" cy="280" r="18" fill="url(#greenGrad)" class="floating-node" filter="url(#glow)"/>
</svg>
